[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "emobot-companion"
version = "1.2.0"
description = "A bilingual desktop companion and ESP32-S3 robot controller"
requires-python = ">=3.13,<3.14"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
dependencies = ["SQLAlchemy>=2.0,<3", "httpx>=0.27,<1", "pyserial>=3.5,<4", "bleak>=0.22,<4"]

[project.optional-dependencies]
voice = ["SpeechRecognition>=3.17,<4", "PyAudio>=0.2.14,<1", "pygame>=2.6,<3"]
flash = ["esptool>=4.8,<6"]
postgres = ["psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1.2,<2", "platformio==6.1.18", "numpy>=2.1,<3"]

[project.scripts]
emobot = "emobot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
emobot = ["resources/*.md"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
